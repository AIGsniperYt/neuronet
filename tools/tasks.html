<div id="tasksTool">
  <style>
    #tasksTool {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--text-main);
      font-family: var(--font-ui, "Source Sans 3", Inter, system-ui, -apple-system, "Segoe UI", sans-serif);
    }

    #tasksHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px;
      background: var(--glass-surface);
      backdrop-filter: blur(var(--glass-blur));
      border-bottom: 1px solid var(--glass-border);
    }

    #tasksHeader h1 {
      margin: 0;
      color: var(--accent);
      font-size: 1.5rem;
      font-weight: 600;
    }

    #tasksSubtitle {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: var(--text-base, 0.92rem);
    }

    .tasks-head-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tasks-meta {
      color: var(--text-muted);
      font-size: var(--text-sm, 0.87rem);
      white-space: nowrap;
    }

    .tasks-ghost-btn,
    .tasks-add-btn,
    .tasks-filter-btn {
      font: inherit;
      font-size: var(--text-base, 0.92rem);
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .tasks-ghost-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    .tasks-ghost-btn:hover:not(:disabled) {
      border-color: rgba(44, 255, 179, 0.45);
      background: rgba(44, 255, 179, 0.08);
      color: var(--accent);
    }

    .tasks-ghost-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .tasks-soon {
      padding: 1px 7px;
      border: 1px solid rgba(44, 255, 179, 0.3);
      border-radius: 999px;
      color: var(--accent);
      font-size: var(--text-xs, 0.72rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #tasksContent {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #tasksContent > * {
      width: 100%;
      max-width: 980px;
      margin-inline: auto;
    }

    .tasks-quick-add {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px 190px auto;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      background: linear-gradient(135deg, var(--panel-strong), var(--panel-bg));
    }

    .tasks-field {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      color: var(--text-main);
      font: inherit;
      font-size: max(16px, var(--text-base, 0.92rem));
    }

    .tasks-field::placeholder { color: var(--text-muted); }
    .tasks-field:focus,
    .tasks-ghost-btn:focus-visible,
    .tasks-add-btn:focus-visible,
    .tasks-filter-btn:focus-visible,
    .task-check:focus-visible,
    .task-icon-btn:focus-visible,
    .task-title-btn:focus-visible {
      outline: 2px solid rgba(44, 255, 179, 0.45);
      outline-offset: 1px;
    }

    .tasks-field[type="date"] { color-scheme: dark; }
    .tasks-field option { background: var(--panel-bg); color: var(--text-main); }

    .tasks-add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 18px;
      border: 1px solid rgba(44, 255, 179, 0.45);
      background: linear-gradient(130deg, rgba(44, 255, 179, 0.24), rgba(44, 255, 179, 0.11));
      color: #e6fff5;
      font-weight: 600;
      white-space: nowrap;
    }

    .tasks-add-btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(130deg, rgba(44, 255, 179, 0.32), rgba(44, 255, 179, 0.18));
    }

    #tasksToolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tasks-filters {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.2);
    }

    .tasks-filter-btn {
      padding: 6px 14px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
    }

    .tasks-filter-btn:hover { color: var(--text-main); }

    .tasks-filter-btn.active {
      border-color: rgba(44, 255, 179, 0.4);
      background: rgba(44, 255, 179, 0.14);
      color: var(--accent);
    }

    .tasks-filter-subject {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: var(--text-sm, 0.87rem);
    }

    .tasks-filter-subject .tasks-field {
      width: auto;
      min-width: 190px;
      padding: 7px 10px;
      border-radius: 9px;
    }

    .tasks-status {
      min-height: 1.2em;
      color: var(--accent);
      font-size: var(--text-sm, 0.87rem);
    }

    .tasks-status.error { color: #ff8c8c; }

    .tasks-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tasks-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 2px 0;
      color: var(--text-muted);
      font-size: var(--text-xs, 0.75rem);
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .tasks-group-title .tasks-group-count {
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-muted);
      font-size: var(--text-xs, 0.72rem);
      letter-spacing: 0;
    }

    .tasks-group-title.overdue { color: #ff9c9c; }

    .tasks-group-list {
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      background: linear-gradient(135deg, var(--panel-strong), var(--panel-bg));
    }

    .task-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .task-row:first-child { border-top: 0; }

    .task-row:hover { background: rgba(255, 255, 255, 0.03); }

    .task-check {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      margin-top: 1px;
      padding: 0;
      border: 1.5px solid rgba(230, 255, 245, 0.3);
      border-radius: 50%;
      background: transparent;
      color: transparent;
      font-size: 0.72rem;
      cursor: pointer;
      transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease;
    }

    .task-check:hover {
      border-color: var(--accent);
      color: rgba(44, 255, 179, 0.45);
    }

    .task-row.done .task-check {
      border-color: var(--accent);
      background: rgba(44, 255, 179, 0.18);
      color: var(--accent);
    }

    .task-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .task-title-btn {
      align-self: flex-start;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-main);
      font: inherit;
      font-size: var(--text-md, 1rem);
      line-height: 1.35;
      text-align: left;
      cursor: text;
      overflow-wrap: anywhere;
    }

    .task-title-btn:hover { color: var(--accent); }

    .task-row.done .task-title-btn {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .task-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .task-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      font-size: var(--text-xs, 0.76rem);
      white-space: nowrap;
    }

    .task-chip.subject {
      background: rgba(44, 255, 179, 0.09);
      color: rgba(230, 255, 245, 0.82);
    }

    .task-chip.classroom {
      background: rgba(120, 170, 255, 0.12);
      color: #a9c8ff;
    }

    .task-chip.overdue {
      background: rgba(255, 107, 107, 0.12);
      color: #ff9c9c;
    }

    .task-row-actions {
      flex: 0 0 auto;
      display: inline-flex;
      gap: 2px;
      opacity: 0.45;
      transition: opacity 0.16s ease;
    }

    .task-row:hover .task-row-actions,
    .task-row:focus-within .task-row-actions { opacity: 1; }

    .task-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
    }

    .task-icon-btn:hover {
      border-color: rgba(44, 255, 179, 0.35);
      background: rgba(44, 255, 179, 0.08);
      color: var(--accent);
    }

    .task-icon-btn.danger:hover {
      border-color: rgba(255, 107, 107, 0.4);
      background: rgba(255, 107, 107, 0.1);
      color: #ff8c8c;
    }

    .task-row-editing { padding: 10px 12px; }

    .task-edit-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .task-edit-fields {
      display: grid;
      grid-template-columns: 150px 200px auto auto;
      gap: 8px;
    }

    .task-edit-fields .tasks-add-btn,
    .task-edit-fields .tasks-ghost-btn {
      padding: 8px 14px;
    }

    .tasks-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 48px 20px;
      border: 1px dashed var(--glass-border);
      border-radius: 16px;
      color: var(--text-muted);
      text-align: center;
    }

    .tasks-empty i {
      color: rgba(44, 255, 179, 0.55);
      font-size: 1.6rem;
    }

    .tasks-empty p {
      margin: 0;
      color: var(--text-main);
      font-size: var(--text-md, 1rem);
    }

    .tasks-empty span { font-size: var(--text-sm, 0.87rem); }

    .tasks-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 2px 0 8px;
      color: var(--text-muted);
      font-size: var(--text-xs, 0.78rem);
      line-height: 1.5;
    }

    .tasks-note i { margin-top: 2px; color: rgba(44, 255, 179, 0.6); }

    @media (max-width: 820px) {
      .tasks-quick-add { grid-template-columns: minmax(0, 1fr) 140px; }
      .tasks-quick-add .tasks-add-btn { grid-column: 1 / -1; }
      .task-edit-fields { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 600px) {
      #tasksHeader { padding: 12px; }
      #tasksContent { padding: 12px; }
      .tasks-quick-add { grid-template-columns: 1fr; }
      .tasks-filter-subject { width: 100%; }
      .tasks-filter-subject .tasks-field { flex: 1; min-width: 0; }
      .task-edit-fields { grid-template-columns: 1fr; }
      .task-row { padding: 11px 12px; }
    }
  </style>

  <header id="tasksHeader">
    <div>
      <h1><span class="tool-reference" title="Tasks tool"><i class="fa-solid fa-list-check" aria-hidden="true"></i><code>Tasks</code></span> Tool</h1>
      <p id="tasksSubtitle">Schoolwork, revision and assignments in one list.</p>
    </div>
    <div class="tasks-head-actions">
      <span id="tasksMeta" class="tasks-meta"></span>
      <button id="tasksClassroomBtn" class="tasks-ghost-btn" type="button" disabled title="Google Classroom sync is not connected yet">
        <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
        <span>Classroom</span>
        <span class="tasks-soon">Soon</span>
      </button>
    </div>
  </header>

  <div id="tasksContent">
    <form id="tasksQuickAdd" class="tasks-quick-add" autocomplete="off">
      <input id="tasksQuickTitle" class="tasks-field" type="text" maxlength="200" placeholder="Add a task — e.g. Finish Macbeth essay" aria-label="Task title">
      <input id="tasksQuickDue" class="tasks-field" type="date" aria-label="Due date">
      <select id="tasksQuickSubject" class="tasks-field" aria-label="Subject"></select>
      <button class="tasks-add-btn" type="submit"><i class="fa-solid fa-plus" aria-hidden="true"></i> Add task</button>
    </form>

    <div id="tasksToolbar">
      <div id="tasksFilters" class="tasks-filters" role="group" aria-label="Filter tasks">
        <button type="button" class="tasks-filter-btn" data-filter="all">All</button>
        <button type="button" class="tasks-filter-btn active" data-filter="open">Open</button>
        <button type="button" class="tasks-filter-btn" data-filter="done">Done</button>
      </div>
      <label class="tasks-filter-subject">
        <span>Subject</span>
        <select id="tasksSubjectFilter" class="tasks-field" aria-label="Filter by subject"></select>
      </label>
    </div>

    <div id="tasksStatus" class="tasks-status" role="status" aria-live="polite"></div>
    <div id="tasksList" class="tasks-list"></div>

    <p class="tasks-note">
      <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
      <span>Google Classroom connection is planned for a later pass. This list is local-only for now — tasks travel with your JSON backup.</span>
    </p>
  </div>
</div>
