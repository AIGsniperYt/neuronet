name: Frontend sync syntax checks

on:
  push:
    branches: [main]
    paths:
      - "src/db.js"
      - "src/sync.js"
      - "src/main.js"
      - "tests/**"
      - ".github/workflows/sync-js-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/db.js"
      - "src/sync.js"
      - "src/main.js"
      - "tests/**"
      - ".github/workflows/sync-js-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser module syntax
        run: |
          node --input-type=module --check < src/db.js
          node --input-type=module --check < src/sync.js
          node --input-type=module --check < src/main.js
          node --check tests/sync-recovery.test.mjs
      - name: Install isolated IndexedDB test dependency
        run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Exercise IndexedDB recovery and cross-tab locking
        run: node --test tests/sync-recovery.test.mjs
